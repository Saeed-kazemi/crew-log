<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e8ebf5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1117" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Crew Log">
<meta name="description" content="Log workouts, food and body measurements. Works offline.">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Crew Log</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* ---------- standalone: mobile-first fixes ---------- */
html,body{overscroll-behavior-y:none}
button,a,input,select,label{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
/* iPhone zooms into any field under 16px: keep every field at 16px or more */
input,select,textarea{font-size:16px!important}
.set input{font-size:1.2rem!important}.stp input{font-size:1.25rem!important}.fq input{font-size:1.15rem!important}
.sheet{max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px));overscroll-behavior:contain}
.sheet.lib{height:min(calc(100dvh - 24px - env(safe-area-inset-top,0px)),740px)}
.modal{padding-top:env(safe-area-inset-top,0px)}
.nav button{min-width:0}
.nav button span,.nav button{white-space:nowrap}
@media (max-width:359px){.nav button{font-size:.62rem}.nav button svg{padding:4px 12px}}
.toast{max-width:min(92vw,520px);text-align:center;line-height:1.35}
.btn[disabled]{opacity:.6;cursor:default}
code{font-family:var(--font-num);font-size:.85em;background:var(--sec);padding:1px 5px;border-radius:6px}

/* food search with a scan button */
.srow{display:flex;gap:8px;align-items:stretch}
.srow input{flex:1;min-width:0}
.scanb{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:0;border-radius:14px;padding:0 14px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:.9rem;cursor:pointer;min-height:48px}
.scanb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* sign-in screens */
body.authed-out .app{padding-bottom:40px}
.au{max-width:440px;margin:0 auto;padding-top:min(6vh,40px)}
.au-brand{display:flex;align-items:center;gap:14px;margin:0 4px 18px}
.au-brand img{border-radius:14px;box-shadow:var(--sh1)}
.au-brand b{display:block;font:700 1.5rem/1.1 var(--font-display)}
.au-brand span{color:var(--sub);font-size:.9rem}
.au-card{padding:22px 18px}
.au-card h1{font-size:1.8rem;margin-bottom:14px}
.au-card form{display:grid;gap:14px}
.au-card .btn.full{margin-top:4px}
.au-msg{padding:11px 13px;border-radius:12px;font-size:.92rem;margin-bottom:12px;line-height:1.4}
.au-msg.bad{background:var(--bad-soft);color:var(--bad)}
.au-msg.good{background:var(--good-soft);color:var(--good)}
.au-links{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;margin-top:10px}
.au-alt{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);display:grid;gap:8px;text-align:center}
.au-alt span{color:var(--sub);font-size:.88rem}
.au-small{margin-top:12px}
.au-foot{margin:14px 6px 0;text-align:center}
.pwf{display:flex;position:relative;margin-top:4px}
.pwf input{margin-top:0!important;padding-right:72px}
.pwt{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.8rem;border-radius:999px;padding:7px 12px;cursor:pointer}
.pwm{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:-6px}
.pwm i{height:5px;border-radius:3px;background:var(--surface2)}
.pwm i.w{background:var(--warn)}.pwm i.s{background:var(--good)}
.pwm span{grid-column:1/-1;font-size:.78rem;color:var(--sub);margin-top:4px}

/* first-run setup */
.su-plans{display:grid;gap:10px}
.su-plan{display:grid;gap:3px;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;cursor:pointer;color:var(--text)}
.su-plan b{font-size:1rem}.su-plan span{font-size:.85rem;color:var(--sub)}
.su-plan[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}

/* settings */
.steps{margin:0 0 8px;padding-left:20px;display:grid;gap:6px}
.dz{margin-top:18px;padding:14px;border-radius:14px;background:var(--bad-soft)}
.dz b{color:var(--bad)}
.dz .sub{margin:4px 0 10px;color:var(--text)}

/* barcode scanner */
.scan{position:fixed;inset:0;z-index:80;background:#000;color:#fff;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.scan-top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
.scan-top b{font:700 1.2rem var(--font-display)}
.scan-x{background:rgba(255,255,255,.18);border:0;color:#fff;font-weight:700;border-radius:999px;padding:10px 18px;min-height:44px;cursor:pointer}
.scan-v{position:relative;flex:1;min-height:0;overflow:hidden}
.scan-v video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan-box{position:absolute;left:10%;right:10%;top:50%;height:30%;transform:translateY(-50%);border:3px solid rgba(255,255,255,.95);border-radius:18px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
.scan-box i{position:absolute;left:8%;right:8%;top:50%;height:2px;background:#ff4d4d;box-shadow:0 0 8px #ff4d4d;animation:scanl 1.6s ease-in-out infinite}
@keyframes scanl{0%,100%{transform:translateY(-30px)}50%{transform:translateY(30px)}}
.scan-s{position:absolute;left:16px;right:16px;bottom:16px;text-align:center;font-size:.95rem;line-height:1.4;background:rgba(0,0,0,.6);border-radius:12px;padding:10px 12px}
.scan-m{padding:14px 16px 16px;background:#111}
.scan-m label{color:#ccc}
.scan-row{display:flex;gap:8px;margin-top:6px}
.scan-row input{flex:1;min-width:0;background:#222;color:#fff;border-bottom-color:#555}
.scan-row .btn{flex:0 0 auto}

/* chip rows that scroll sideways: fade the right edge so it is clear there is more */
@media (max-width:899px){
  .sheet .chips,.pvchips{-webkit-mask-image:linear-gradient(to right,#000 82%,transparent);mask-image:linear-gradient(to right,#000 82%,transparent);padding-right:36px}
}

.pwr{list-style:none;margin:-4px 0 0;padding:0;display:grid;gap:4px;font-size:.85rem;color:var(--sub)}
.pwr li{display:flex;align-items:center;gap:8px}
.pwr li::before{content:"";width:16px;height:16px;border-radius:50%;border:2px solid var(--line);flex:none;box-sizing:border-box}
.pwr li.ok{color:var(--good)}
.pwr li.ok::before{background:var(--good);border-color:var(--good);content:"\2713";color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1}

/* filter dropdowns in the exercise sheets: everything visible, no sideways scrolling */
.fbar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.fbar label:first-child{grid-column:1/-1}
.fbar.one{grid-template-columns:1fr}
.fbar label{font-size:.72rem;min-width:0}
.fbar select{margin-top:3px;padding:10px 26px 10px 10px;text-overflow:ellipsis;white-space:nowrap;overflow:hidden;min-height:46px}
.fbar select.on{background-color:var(--accent-soft);border-bottom-color:var(--accent);color:var(--accent);font-weight:600}
@media (min-width:600px){.fbar{grid-template-columns:repeat(3,minmax(0,1fr))}.fbar label:first-child{grid-column:auto}}

.au-splash{display:flex;align-items:center;justify-content:center;gap:12px;padding:18px 0;color:var(--sub);font-weight:600}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--accent-soft);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ready-made programmes */
.pgc h2{margin:2px 0 6px}
.pgb{display:grid;gap:8px;background:var(--accent-soft);box-shadow:none;margin-bottom:12px}
.pgb b{display:block;font:700 1.05rem var(--font-display);letter-spacing:.01em}
.pgb span{font-size:.88rem;line-height:1.4;color:var(--text)}
.pgb.easy{background:var(--good-soft)}
.pgb.done{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--good-soft)}
.pgbar{display:block;width:100%;height:6px;border:0;padding:0;border-radius:3px;background:var(--surface);overflow:hidden;pointer-events:none}
.pgbar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.pgrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px;cursor:pointer;color:var(--text)}
.pgrow .lt{flex:1;min-width:0}
.pgrow b{font:700 1.1rem var(--font-display)}
.pgrow small{display:block;color:var(--sub);font-size:.8rem;margin:2px 0 6px}
.pgs{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:.86rem;color:var(--sub);line-height:1.4}
.pgrow .chev{flex:0 0 32px;width:32px;height:32px;font-size:1.4rem}
.pgtips{margin:0;padding-left:20px;display:grid;gap:6px;font-size:.9rem}
.pgweeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.pgw{display:flex;align-items:center;gap:8px;background:var(--sec);border-radius:10px;padding:7px 9px;font-size:.8rem}
.pgw b{flex:0 0 24px;height:24px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-size:.78rem}
.pgw.easy{background:var(--good-soft)}.pgw.easy b{background:var(--good)}
.pgday{background:var(--sec);border-radius:14px;padding:10px 12px;margin-top:8px}
.pgdh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.pgdh b{font:700 1rem var(--font-display)}.pgdh span{font-size:.78rem;color:var(--sub)}
.pgex{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:.9rem}
.pgex:first-of-type{border-top:0}
.pgex small{display:block;color:var(--sub);font-size:.76rem}
.pgsr{font:600 .85rem var(--font-num);white-space:nowrap}
.pgex .link{min-height:36px;padding:6px 10px}
.fbar.four{grid-template-columns:repeat(2,minmax(0,1fr))}
.fbar.four label:first-child{grid-column:auto}
@media (min-width:600px){.fbar.four{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pgtop{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.pglv{margin:16px 2px 0;font:700 .75rem var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--sub)}
.pgrow.top{border:2px solid var(--good)}
.pgrow.mine{cursor:default;gap:8px}
.pgrow.mine .btn{flex:0 0 auto}
.q{margin-bottom:16px}
.q>b{display:block;font:700 1rem var(--font-display);margin-bottom:6px}
.qrow{display:flex;flex-wrap:wrap;gap:8px}
.qopt{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:12px;padding:10px 14px;font-weight:600;font-size:.9rem;min-height:44px;cursor:pointer}
.qopt[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=Roboto:wght@400;500;700&family=JetBrains+Mono:wght@600;700&display=swap">
<style>
/* Layout: phone-first gym log. One scrolling column of cards, fixed bottom tab bar, big tap targets for sets, condensed display numerals. */
:root{
  --bg:#e8ebf5;--surface:#ffffff;--surface2:#e3e8f6;--line:#c7cde0;--text:#13161f;--sub:#474e63;
  --accent:#3050d0;--on-accent:#ffffff;--accent-soft:#dbe2ff;
  --sec:#f4f6fc;--sh1:0 1px 2px rgba(19,30,70,.12),0 2px 10px rgba(19,30,70,.08);--sh2:0 2px 6px rgba(19,30,70,.18),0 6px 18px rgba(19,30,70,.12);--shb:0 1px 3px rgba(19,30,70,.3);
  --good:#217a47;--good-soft:#d9efe2;--warn:#9a5b06;--warn-soft:#f6e8cc;--bad:#b3301d;--bad-soft:#f7dcd6;
  --navh:76px;--nbh:0px;
  --font-num:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --font-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --font-body:'Roboto',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1117;--surface:#1a1d27;--surface2:#272b3a;--line:#363b4e;--text:#e6e9f4;--sub:#9aa2ba;
    --accent:#b0bdff;--on-accent:#0d1a55;--accent-soft:#29346f;
    --sec:#212532;--sh1:0 0 0 1px #2f3446;--sh2:0 0 0 1px #3a4058,0 8px 24px rgba(0,0,0,.45);--shb:none;
    --good:#62cf8c;--good-soft:#153221;--warn:#e3aa52;--warn-soft:#382a10;--bad:#f28b77;--bad-soft:#3b1c16;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1117;--surface:#1a1d27;--surface2:#272b3a;--line:#363b4e;--text:#e6e9f4;--sub:#9aa2ba;
  --accent:#b0bdff;--on-accent:#0d1a55;--accent-soft:#29346f;
  --sec:#212532;--sh1:0 0 0 1px #2f3446;--sh2:0 0 0 1px #3a4058,0 8px 24px rgba(0,0,0,.45);--shb:none;
  --good:#62cf8c;--good-soft:#153221;--warn:#e3aa52;--warn-soft:#382a10;--bad:#f28b77;--bad-soft:#3b1c16;
  color-scheme:dark;
}
:root[data-theme="black"]{
  --bg:#000000;--surface:#1c1c1e;--surface2:#2c2c2e;--line:#38383a;--text:#ffffff;--sub:#9a9aa1;
  --accent:#34f06b;--on-accent:#000000;--accent-soft:#0e2a17;
  --sec:#242426;--sh1:0 0 0 1px #2e2e30;--sh2:0 0 0 1px #3a3a3c;--shb:none;
  --good:#34f06b;--good-soft:#0e2a17;--warn:#ffb340;--warn-soft:#33260c;--bad:#ff6961;--bad-soft:#3a1715;
  color-scheme:dark;
}
:root[data-theme="black"] .chk.on,:root[data-theme="black"] .wd.done b,:root[data-theme="black"] .tick.on .box,:root[data-theme="black"] .cal .c.done{color:#000}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:400 15px/1.45 var(--font-body);-webkit-text-size-adjust:100%}
.app{max-width:620px;margin:0 auto;padding:14px 16px calc(150px + var(--nbh,0px))}
h1,h2,h3{font-family:var(--font-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:2rem;line-height:1.05}
h2{font-size:1.35rem}
h3{font-size:1.2rem;line-height:1.1}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--sub);font-weight:600}
.sub{color:var(--sub);font-size:.85rem}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.top>div{min-width:0}
.sync{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:5px 10px;font-size:.72rem;font-weight:600;color:var(--sub);cursor:pointer}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--sub);display:block}
.sync[data-s="synced"] i{background:var(--good)}
.sync[data-s="saving"] i{background:var(--warn)}
.sync[data-s="error"] i{background:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card>h2,.card>h3{margin-bottom:8px}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;padding:11px 16px;font-weight:600;font-size:.95rem;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn.ghost{background:var(--surface2);color:var(--text)}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:7px 11px;font-size:.8rem;border-radius:8px}
.btn.full{width:100%}
.link{background:none;border:0;color:var(--accent);font-weight:600;font-size:.85rem;padding:6px 0;cursor:pointer}
.link.bad{color:var(--bad)}
input,select,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
textarea{resize:vertical}
label{display:block;font-size:.75rem;font-weight:600;color:var(--sub);min-width:0}
label>input,label>select,label>textarea{margin-top:4px;font-weight:400;font-size:.95rem;color:var(--text)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 120px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stat b{display:block;font:700 1.45rem/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.stat span{font-size:.7rem;color:var(--sub);font-weight:600}
.datebar{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center;margin-bottom:12px}
.datebar .dt{text-align:center;font-weight:600}
.datebar .back{display:block;font-size:.75rem;color:var(--accent);background:none;border:0;margin:0 auto;cursor:pointer;font-weight:600}
.nudge{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--warn-soft);border-color:transparent}
.chip{display:inline-block;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:middle;letter-spacing:.03em}
.chip.warn{background:var(--warn-soft);color:var(--warn);margin:0 0 8px}
.chip.good{background:var(--good-soft);color:var(--good)}
.ex-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.meta{font-size:.82rem;color:var(--sub);font-variant-numeric:tabular-nums}
.last{font-size:.82rem;color:var(--sub);margin-bottom:4px;font-variant-numeric:tabular-nums}
.hint{font-size:.82rem;color:var(--good);font-weight:600;margin-bottom:4px}
.cue{font-size:.88rem;background:var(--surface2);border-radius:8px;padding:8px 10px;margin:6px 0}
.sets{display:grid;gap:8px;margin:10px 0 6px}
.set,.setH{display:grid;grid-template-columns:30px 58px minmax(0,1fr) minmax(0,1fr) 48px;gap:8px;align-items:center}
.sets.rpe .set,.sets.rpe .setH{grid-template-columns:30px minmax(0,1fr) minmax(0,1fr) 54px 48px}
.sets.rpe .prev,.sets.rpe .setH .ph{display:none}
@media (min-width:560px){.sets.rpe .set,.sets.rpe .setH{grid-template-columns:30px 58px minmax(0,1fr) minmax(0,1fr) 54px 48px}.sets.rpe .prev{display:block}.sets.rpe .setH .ph{display:block}}
.setH{font-size:.7rem;font-weight:600;color:var(--sub);text-align:center;letter-spacing:.06em;text-transform:uppercase}
.tb{width:30px;height:44px;border-radius:15px;border:1.5px solid var(--line);background:var(--bg);font:700 .8rem var(--font-num);color:var(--sub);padding:0;cursor:pointer;justify-self:center}
.tb.t-w{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tb.t-d{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.sw{position:relative;overflow:hidden;border-radius:10px}
.swdel{visibility:hidden;position:absolute;inset:0;background:var(--bad);color:#fff;display:flex;align-items:center;justify-content:flex-end;padding-right:18px;font-weight:700;font-size:.9rem}
.sw.on .swdel{visibility:visible}
.sw.arm .swdel{filter:brightness(1.2)}
.sw .set{position:relative;background:var(--surface);touch-action:pan-y}
.set input{height:50px;text-align:center;font:700 1.2rem var(--font-num);font-variant-numeric:tabular-nums;padding:4px}
.prev{background:none;border:0;padding:0;font:600 .72rem var(--font-num);color:var(--sub);text-align:center;cursor:pointer;font-variant-numeric:tabular-nums;white-space:nowrap}
.prev:disabled{cursor:default;opacity:.5}

.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}

.delta.good{color:var(--good)!important}.delta.bad{color:var(--bad)!important}
.bar{display:block;height:5px;background:var(--surface2);border-radius:3px;margin:6px 0 3px;overflow:hidden}

svg.chart{width:100%;height:auto;display:block}

.ring{position:relative;width:56px;height:56px;flex:0 0 56px}

function beep(){

}
function startRest(sec,name){

function paintTimer(){
  const t=$('#timer');
  if(hold){
    const el=Math.floor((Date.now()-hold.start)/1000);
    if(!hold.beeped&&el>=hold.target){hold.beeped=true;beep();}
    const fr=Math.min(1,el/Math.max(1,hold.target));
    t.className='timer'+(hold.beeped?' over':'');
    t.innerHTML=ringHTML(fr,mmss(el))+'<div class="tl"><b>'+esc(hold.ex.n)+'</b><br>'+(hold.beeped?'Target reached. Finish when you must.':'Target '+hold.target+' s')+'</div><button data-a="hold-done">Done</button><button data-a="hold-cancel">Cancel</button>';
    t.hidden=false;return;
  }
  if(!rest){t.hidden=true;if(tickId){clearInterval(tickId);tickId=null;}return;}
  const left=Math.ceil((rest.end-Date.now())/1000);
  if(left<=0){
    if(!rest.over){rest.over=true;rest.hide=Date.now()+4000;beep();}
    if(Date.now()>rest.hide){rest=null;paintTimer();return;}
    t.className='timer over';
    t.innerHTML=ringHTML(1,'Go')+'<div class="tl"><b>Rest is over</b><br>Next set when you are ready.</div><button data-a="rest-skip">Close</button>';
    t.hidden=false;return;
  }
  const frac=Math.max(0,Math.min(1,left/Math.max(1,rest.total)));
  t.className='timer';
  t.innerHTML=ringHTML(frac,mmss(left))+'<div class="tl">Rest after '+esc(rest.name||'set')+'</div><button data-a="rest-sub" aria-label="Subtract 30 seconds">-30s</button><button data-a="rest-add" aria-label="Add 30 seconds">+30s</button><button data-a="rest-skip">Skip</button>';

}

function suggest(ex,date){

  const lower=m.p.some(x=>x==='Quads'||x==='Hamstrings'||x==='Glutes'||x==='Lower back');

    const x=sets[Math.min(i,sets.length-1)],w=+x.w||0,r=+x.r||0;

    else{ws.push(w||'');rs.push(top?Math.min(top,r+1):r);}
  }
  const maxW=Math.max.apply(null,sets.map(x=>+x.w||0)),maxR=Math.max.apply(null,sets.map(x=>+x.r||0));
  let note;
  if(m.timed)note='Best hold last time: '+maxR+' s. Aim for '+rs[0]+' s today.';
  else if(hit)note='Top of the range on every set last time. Today: '+(m.bw&&!maxW?'add '+fmt(inc)+' kg':fmt(maxW+inc)+' kg')+' and aim for '+(lo||'')+'+ reps.';
  else if(m.bw&&!maxW)note='Bodyweight. Aim for one more rep on each set.';
  else note='Same weight as last time ('+fmt(maxW)+' kg). Aim for one more rep on each set.';
  if(!hit&&!m.timed&&!(m.bw&&!maxW)){
    const stl=stallCheck(ex,date);
    if(stl){note='Same weight for 3 sessions without progress. Reset to '+fmt(stl.drop)+' kg (about 10% lighter) and build back up, or tap Swap for a similar exercise.';for(let i=0;i<ws.length;i++)ws[i]=stl.drop;}
  }
  return {ws:ws,rs:rs,note:note};
}

    h+='<div class="last">Last ('+fmtD(last.date)+'): '+last.sets.map(x=>setLong(ex,x)).join(', ')+'</div>';

  let heaviest='';
  for(let i=0;i<n;i++){
    const x=(st&&st[i])||{w:'',r:'',d:false};
    if(x.w!==''&&x.w!=null&&(heaviest===''||+x.w>+heaviest))heaviest=x.w;
    const ph=placeholderFor(ex.id,i,date),pv=prevTxt(ex.id,i,date);
    const lbl=x.t==='w'?'W':x.t==='d'?'D':x.t==='m'?'M':x.t==='l'?'L':String(i+1);
    h+='<div class="sw" data-ex="'+esc(ex.id)+'" data-n="'+i+'"><div class="swdel" aria-hidden="true">Delete</div><div class="set">'
     +'<button class="tb t-'+(x.t||'n')+'" data-a="set-type" data-ex="'+esc(ex.id)+'" data-n="'+i+'" aria-label="Set '+(i+1)+', '+typeName(x.t)+'. Tap to change the type">'+lbl+'</button>'

     +'<input type="number" inputmode="decimal" step="any" id="w-'+ex.id+'-'+i+'" data-i="sw" data-ex="'+esc(ex.id)+'" data-n="'+i+'" value="'+esc(x.w)+'" placeholder="'+esc(ph.w)+'" aria-label="Set '+(i+1)+' '+(m.bw?'added or assisted kilograms':'kilograms')+'">'

     +(rpeOn?'<input type="number" inputmode="decimal" step="0.5" min="1" max="10" data-i="srpe" data-ex="'+esc(ex.id)+'" data-n="'+i+'" value="'+esc(x.rpe==null?'':x.rpe)+'" placeholder="-" aria-label="Set '+(i+1)+' RPE">':'')
     +'<button class="chk'+(x.d?' on':'')+'" data-a="tog-set" data-ex="'+esc(ex.id)+'" data-n="'+i+'" aria-pressed="'+(!!x.d)+'" aria-label="Set '+(i+1)+' done">'+CHECK+'</button></div></div>';
  }
  const pw=heaviest!==''?heaviest:(placeholderFor(ex.id,0,date).w);
  h+='</div><div class="ex-f"><button class="btn ghost sm" data-a="add-set" data-ex="'+esc(ex.id)+'">+ Set</button>'+(n>1?'<button class="btn ghost sm" data-a="del-set" data-ex="'+esc(ex.id)+'">- Set</button>':'')+(m.timed?'<button class="btn ghost sm" data-a="hold-start" data-ex="'+esc(ex.id)+'">Time a set</button>':'')+((!m.bw&&!m.timed&&!m.cardio)?'<button class="btn ghost sm" data-a="plates" data-w="'+esc(pw)+'">Plates</button>':'')+'</div><p class="sub" style="margin-top:6px;font-size:.72rem">Swipe a set left to delete it. Tap the set number to cycle: working, W warm-up, D drop, M myo-rep, L deload.</p></section>';
  return h;
}
/* ---------- next-set bar, personal bests ---------- */
function e1(w,r){w=+w||0;r=+r||0;return w>0&&r>0?w*(1+r/30):0;}
function bestBefore(ex,date){
  let b=0;
  Object.keys(S.days).forEach(k=>{
    if(k===date)return;const d=S.days[k];
    Object.keys(d.sets||{}).forEach(id=>{
      const nm=d.names&&d.names[id];
      if(id!==ex.id&&!(nm&&String(nm).toLowerCase()===String(ex.n).toLowerCase()))return;
      (d.sets[id]||[]).forEach(x=>{if(x.d&&isRef(x)){const v=e1(effLoad(ex,x.w),x.r);if(v>b)b=v;}});
    });
  });
  return b;
}
function onLogged(ex,st,s){
  s.pr=false;
  const m=metaOf(ex);
  if(s.t==='w'){startRest(Math.min(+ex.rest||60,60),ex.n+' warm-up');return;}
  if(s.t==='m'){startRest(20,ex.n+' myo-rep');return;}
  if(!m.timed&&!m.cardio&&isRef(s)){
    const v=e1(effLoad(ex,s.w),s.r),prior=bestBefore(ex,ui.date);
    if(v&&prior){
      let t=0;st.forEach(x=>{if(x!==s&&x.d&&isRef(x)){const y=e1(effLoad(ex,x.w),x.r);if(y>t)t=y;}});
      if(v>prior&&v>t){s.pr=true;toast('New best on '+ex.n+': about '+fmt(Math.round(v*2)/2)+' kg for one rep');}
    }
  }
  startRest(ex.rest,ex.n);
}
function nextSet(day,dd){
  for(const ex0 of day.ex){
    const ex=exFor(dd,ex0),st=setsFor(dd,ex),n=st?st.length:ex.s;
    for(let i=0;i<n;i++){const s=st&&st[i];if(!s||!s.d)return {ex:ex,i:i,n:n};}
  }
  return null;
}
function valFor(ex,i,date){
  const dd=S.days[date],st=dd&&dd.sets&&dd.sets[ex.id],s=st&&st[i];
  let w=s&&s.w!==''&&s.w!=null?s.w:'',r=s&&s.r!==''&&s.r!=null?s.r:'';
  if(w===''||r===''){
    const p=(i>0&&st&&st[i-1]&&st[i-1].d)?{w:st[i-1].w,r:st[i-1].r}:placeholderFor(ex.id,i,date);
    if(w==='')w=p.w;if(r==='')r=p.r;
  }
  return {w:w,r:r};
}
function curNext(){
  const day=S.plan.days.find(d=>d.id===activeDayId(ui.date));if(!day)return null;
  const dd=sessionDoc(),nx=nextSet(day,dd);if(!nx)return null;
  const st=ensureSets(dd,nx.ex);while(st.length<=nx.i)st.push({w:'',r:'',d:false});
  return {ex:nx.ex,i:nx.i,st:st};
}
function stepper(k,val,u){
  return '<div class="stp"><button data-a="nx-'+k+'" data-dir="-1" aria-label="Decrease '+u+'">&minus;</button><label><input type="number" inputmode="decimal" step="any" value="'+esc(val)+'" data-i="nx'+k+'" aria-label="'+u+' for the next set" placeholder="0"><small>'+u+'</small></label><button data-a="nx-'+k+'" data-dir="1" aria-label="Increase '+u+'">+</button></div>';
}
function nextBarHTML(){
  if(ui.tab!=='today')return '';
  const day=S.plan.days.find(d=>d.id===activeDayId(ui.date));
  if(!day||!day.ex.length)return '';
  const dd=S.days[ui.date]||null;
  if(dd&&dd.fin)return '';

  const m=metaOf(nx.ex),v=valFor(nx.ex,nx.i,ui.date),pv=prevTxt(nx.ex.id,nx.i,ui.date);

}
function paintNext(){
  const b=$('#nextbar');if(!b)return;

function ensureSets(dd,ex){
  dd.names=dd.names||{};if(dd.names[ex.id]!==ex.n)dd.names[ex.id]=ex.n;
  let st=dd.sets[ex.id];
  if(!st||!st.length){st=dd.sets[ex.id]=[];for(let i=0;i<ex.s;i++)st.push({w:'',r:'',d:false});}
  return st;
}

/* ---------- Progress ---------- */
function chart(pts,o){
  const W=340,H=190,L=40,R=14,T=14,B=26;
  const vals=pts.map(p=>p.v);
  if(o.start!=null)vals.push(o.start);
  if(o.target!=null)vals.push(o.target);
  if(o.ma)o.ma.forEach(q=>vals.push(q.v));
  let lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals);
  if(lo===hi){lo-=1;hi+=1;}
  const pv=(hi-lo)*.14;lo-=pv;hi+=pv;
  const t0=parseD(pts[0].d).getTime(),t1=parseD(pts[pts.length-1].d).getTime();
  const X=d=>(pts.length===1||t1===t0)?(L+(W-L-R)/2):L+(parseD(d).getTime()-t0)/(t1-t0)*(W-L-R);
  const Y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.label)+' over time">';
  for(let i=0;i<4;i++){
    const v=lo+(hi-lo)*i/3,y=Y(v);
    s+='<path class="g" d="M'+L+' '+y.toFixed(1)+'H'+(W-R)+'"/><text x="'+(L-6)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end">'+(Math.round(v*10)/10)+'</text>';
  }
  if(o.start!=null){const y=Y(o.start).toFixed(1);s+='<path class="r1" d="M'+L+' '+y+'H'+(W-R)+'"/><text x="'+(L+4)+'" y="'+(y-4)+'">Start '+fmt(o.start)+'</text>';}
  if(o.target!=null){const y=Y(o.target).toFixed(1);s+='<path class="r2" d="M'+L+' '+y+'H'+(W-R)+'"/><text class="t2" x="'+(W-R-4)+'" y="'+(y-4)+'" text-anchor="end">Target '+fmt(o.target)+'</text>';}
  const xy=pts.map(p=>[X(p.d),Y(p.v)]);
  if(pts.length>1){
    s+='<path class="a" d="M'+xy[0][0].toFixed(1)+' '+(H-B)+' '+xy.map(p=>'L'+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')+' L'+xy[xy.length-1][0].toFixed(1)+' '+(H-B)+'Z"/>';
    s+='<path class="l" d="'+xy.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')+'"/>';
  }
  if(o.ma&&o.ma.length>1)s+='<path class="l2" d="'+o.ma.map((q,i)=>(i?'L':'M')+X(q.d).toFixed(1)+' '+Y(q.v).toFixed(1)).join(' ')+'"/>';
  xy.forEach((p,i)=>{s+='<circle class="p'+(o.ma?' dim':'')+'" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(i===xy.length-1?5:3.5)+'"/>';});
  if(pts.length===1)s+='<text x="'+X(pts[0].d).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+fmtD(pts[0].d)+'</text>';
  else s+='<text x="'+L+'" y="'+(H-8)+'">'+fmtD(pts[0].d)+'</text><text x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end">'+fmtD(pts[pts.length-1].d)+'</text>';
  return s+'</svg>';
}

let EXDB=null,EXLOAD=null;
const XMAPPED=new Set(Object.keys(EXMAP).map(k=>EXMAP[k]));
function exLoad(){
  if(EXDB)return Promise.resolve(EXDB);
  if(!EXLOAD)EXLOAD=fetch('exdb.json').then(r=>{if(!r.ok)throw new Error('http '+r.status);return r.json();}).then(a=>{EXDB=a;return a;}).catch(e=>{EXLOAD=null;throw e;});
  return EXLOAD;
}
function xeq(e){return XEQ[e]||(e?e.charAt(0).toUpperCase()+e.slice(1):'');}
function xmu(a){return a.map(m=>XMU[m]||m);}
function xbFind(name){
  if(!EXDB)return null;
  const k=String(name).toLowerCase().trim(),id=EXMAP[k];
  if(id){const e=EXDB.find(x=>x.i===id);if(e)return e;}
  let e=EXDB.find(x=>x.n.toLowerCase()===k);if(e)return e;
  const toks=k.split(/[^a-z0-9]+/).filter(t=>t.length>2);
  if(!toks.length)return null;
  let best=null,bs=0;
  EXDB.forEach(x=>{const h=x.n.toLowerCase();let sc=0;toks.forEach(t=>{if(h.indexOf(t)>=0)sc++;});sc=sc/toks.length-Math.abs(h.split(/\s+/).length-toks.length)*0.02;if(sc>bs){bs=sc;best=x;}});
  return bs>=0.99?best:null;
}
function xbNew(){return {mode:'list',state:'load',q:'',mu:'All',eq:'All',ty:'All',fo:false,n:40,id:null,fr:'play',want:null,scroll:0,from:'list'};}
function xbOpen(want){
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  ui.xb=xbNew();ui.xb.want=want||null;if(reduce)ui.xb.fr=0;
  paintModal();
  exLoad().then(()=>{
    const X=ui.xb;if(!X)return;
    X.state='ok';
    if(X.want){const e=xbFind(X.want);if(e){X.mode='detail';X.id=e.i;X.from='card';}else X.q=X.want;X.want=null;}
    paintXb();
  }).catch(()=>{if(ui.xb){ui.xb.state='err';paintXb();}});
}
function xbList(){
  const X=ui.xb,q=X.q.trim().toLowerCase(),toks=q.split(/\s+/).filter(Boolean);
  let out=EXDB.filter(e=>{
    if(X.mu!=='All'&&e.p.indexOf(X.mu)<0)return false;
    if(X.eq!=='All'&&e.e!==X.eq)return false;
    if(X.ty!=='All'&&e.c!==X.ty)return false;
    if(toks.length){const h=(e.n+' '+xmu(e.p).join(' ')+' '+xeq(e.e)).toLowerCase();return toks.every(t=>h.indexOf(t)>=0);}
    return true;
  });
  if(toks.length){
    out.sort((a,b)=>{const an=a.n.toLowerCase(),bn=b.n.toLowerCase();const as=an.indexOf(q)===0?0:an.indexOf(q)>0?1:2,bs=bn.indexOf(q)===0?0:bn.indexOf(q)>0?1:2;return as-bs||an.length-bn.length;});
  }else out.sort((a,b)=>(XMAPPED.has(b.i)?1:0)-(XMAPPED.has(a.i)?1:0)||(a.n<b.n?-1:1));
  return out;
}
function xbRow(e){
  return '<button class="xrow" data-a="xb-sel" data-id="'+esc(e.i)+'"><span class="xth"><img src="ex/s'+e.f+'.jpg" style="top:-'+(e.k*100)+'%" loading="lazy" alt=""></span><span class="lt"><b>'+esc(e.n)+'</b><small>'+esc(xmu(e.p).join(', ')||'Whole body')+' &middot; '+esc(xeq(e.e))+'</small></span><span class="chev">&#8250;</span></button>';
}
function xbListHTML(){
  const X=ui.xb,all=xbList(),shown=all.slice(0,X.n);
  if(!all.length)return '<p class="sub" style="padding:12px 4px">Nothing matches. Try fewer words or clear a filter.</p>';
  let h='<p class="sub" style="padding:2px 4px 6px">'+all.length+' exercise'+(all.length===1?'':'s')+'</p>'+shown.map(xbRow).join('');
  if(all.length>shown.length)h+='<div style="padding:10px 0"><button class="btn ghost full" data-a="xb-more">Show more ('+(all.length-shown.length)+' left)</button></div>';
  return h;
}
function xbChipsHTML(){
  const X=ui.xb,mus=['All'].concat(Object.keys(XMU).sort((a,b)=>XMU[a]<XMU[b]?-1:1));
  const eqs=['All'].concat(Array.from(new Set(EXDB.map(e=>e.e))).sort());
  const sel=(id,lbl,cur,opts)=>'<label for="'+id+'">'+lbl+'<select id="'+id+'" data-c="'+id+'"'+(cur!=='All'?' class="on"':'')+'>'+opts.map(o=>'<option value="'+esc(o[0])+'"'+(o[0]===cur?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select></label>';
  let h='<div class="fbar">'+sel('xb-mu-s','Muscle',X.mu,mus.map(m=>[m,m==='All'?'All':XMU[m]]))+sel('xb-eq-s','Equipment',X.eq,eqs.map(m=>[m,m==='All'?'Any':xeq(m)]))+sel('xb-ty-s','Type',X.ty,XTYPE.map(m=>[m[0],m[0]==='All'?'All':m[1]]))+'</div>';
  if(X.mu!=='All'||X.eq!=='All'||X.ty!=='All')h+='<button class="link" data-a="xb-clear" style="margin-top:2px">Clear filters</button>';
  return h;
}
function xbAnimHTML(e){
  const X=ui.xb,c='xanim'+(X.fr===0?' p0':X.fr===1?' p1':'');
  return '<div class="'+c+'" id="xb-anim"><img src="ex/s'+e.f+'.jpg" style="top:-'+(e.k*100)+'%" alt="Start and end position of '+esc(e.n)+'"></div><div class="chips" style="margin-top:8px" id="xb-fr"><button data-a="xb-fr" data-v="play" aria-pressed="'+(X.fr==='play')+'">Play</button><button data-a="xb-fr" data-v="0" aria-pressed="'+(X.fr===0)+'">Start</button><button data-a="xb-fr" data-v="1" aria-pressed="'+(X.fr===1)+'">End</button></div>';
}
function xbDetailHTML(){
  const X=ui.xb,e=EXDB.find(x=>x.i===X.id);
  if(!e)return '<p class="sub">Not found.</p>';
  const mine=libAll().find(x=>EXMAP[String(x.n).toLowerCase()]===e.i||String(x.n).toLowerCase()===e.n.toLowerCase());
  let h='<div class="shh"><button class="link" data-a="xb-back">&#8249; '+(X.from==='card'?'Browse all':'Back')+'</button><button class="link" data-a="pm-close">Close</button></div><div class="xdet"><h2>'+esc(e.n)+'</h2>'+xbAnimHTML(e)
   +'<div class="xtags">'+xmu(e.p).map(m=>'<span class="xt pm">'+esc(m)+'</span>').join('')+xmu(e.s).map(m=>'<span class="xt">'+esc(m)+'</span>').join('')+'<span class="xt eqt">'+esc(xeq(e.e))+'</span>'+(e.l?'<span class="xt eqt">'+esc(e.l)+'</span>':'')+'</div>';
  if(mine&&mine.cue)h+='<p class="hint" style="margin:10px 0 0">Coach tip: '+esc(mine.cue)+'</p>';
  h+='<h3 class="xh">How to do it</h3>'+(e.t.length?'<ol class="xsteps">'+e.t.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ol>':'<p class="sub">No written steps for this one. Watch the video below.</p>');
  h+='<a class="btn ghost full" style="margin-top:6px" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query='+encodeURIComponent(e.n+' exercise form')+'">Watch a video</a>';
  h+='<div class="xadd"><label for="xb-day">Add to a training day<select id="xb-day">'+S.plan.days.map(d=>'<option value="'+esc(d.id)+'">'+esc(d.name)+(d.wd>=0?' ('+WD[d.wd]+')':'')+'</option>').join('')+'</select></label><button class="btn" data-a="xb-add" data-id="'+esc(e.i)+'">Add to plan</button></div></div>';
  return h;
}
function paintXb(){
  const m=$('#modal'),X=ui.xb;
  const head='<div class="mback" data-a="pm-close"></div><div class="sheet lib xsheet" role="dialog" aria-modal="true" aria-label="Exercise bank">';
  if(X.state==='load'){m.innerHTML=head+'<div class="shh"><h2>Exercise bank</h2><button class="link" data-a="pm-close">Close</button></div><p class="sub">Loading the exercises...</p></div>';m.hidden=false;return;}
  if(X.state==='err'){m.innerHTML=head+'<div class="shh"><h2>Exercise bank</h2><button class="link" data-a="pm-close">Close</button></div><p class="sub">Could not load the exercise list. Check your connection and try again.</p><button class="btn full" data-a="xb-retry">Try again</button></div>';m.hidden=false;return;}
  if(X.mode==='detail'){m.innerHTML=head+'<div class="xscroll">'+xbDetailHTML()+'</div></div>';m.hidden=false;return;}
  m.innerHTML=head+'<div class="shh"><h2>Exercise bank</h2><button class="link" data-a="pm-close">Close</button></div><input id="xb-q" type="search" data-i="xb-q" placeholder="Search: squat, biceps, cable..." value="'+esc(X.q)+'" aria-label="Search exercises" autocomplete="off"><div id="xb-chips" style="margin-top:8px">'+xbChipsHTML()+'</div><div id="xb-list" class="llist">'+xbListHTML()+'</div></div>';
  m.hidden=false;
  const l=$('#xb-list');if(l&&X.scroll)l.scrollTop=X.scroll;
}
function refreshXb(parts){
  const X=ui.xb;if(!X||X.mode!=='list'||X.state!=='ok')return;
  if(parts.indexOf('l')>=0){const l=$('#xb-list');if(l){l.innerHTML=xbListHTML();}}
  if(parts.indexOf('c')>=0){const c=$('#xb-chips');if(c)c.innerHTML=xbChipsHTML();}
}

function lev1(a,b){

function exMap(){

function setsStats(from,to){
  const pm=exMap(),mus={},names={},ses={},last={};let sets=0,vol=0,sess=0;
  MKEYS.forEach(k=>{mus[k]=0;});
  sortedDates().forEach(k=>{
    if(k<from||k>to)return;
    const dd=S.days[k];if(!dd||!dd.sets)return;
    let any=false;const prd={};
    Object.keys(dd.sets).forEach(id=>{
      let ex=pm[id];
      if(dd.swaps){for(const o in dd.swaps){if(dd.swaps[o].id===id)ex=dd.swaps[o];}}
      if(!ex)return;
      const m=metaOf(ex);
      dd.sets[id].forEach(x=>{
        if(!x.d||x.t==='w')return;
        any=true;m.p.forEach(u=>{prd[u]=1;});
        const wt=x.t==='l'?0.5:1;
        m.p.forEach(u=>{mus[u]+=wt;});
        m.s.forEach(u=>{mus[u]+=0.5*wt;});
        if(m.p.length||m.s.length)sets++;
        if(!m.timed&&!m.cardio)vol+=effLoad(ex,x.w)*(+x.r||0);
      });
    });
    Object.keys(prd).forEach(u=>{ses[u]=(ses[u]||0)+1;last[u]=k;});

}

function viewAnalytics(){
  const real=dstr(new Date()),ws=weekStart(real);
  const vals=[],labs=[];let tot=0;
  const mode=ui.vm==='sets'?'sets':'kg';
  for(let i=7;i>=0;i--){
    const a=addDays(ws,-7*i),b=addDays(a,6),st=setsStats(a,b);
    const v=mode==='sets'?st.sets:st.vol;
    vals.push(v);labs.push(String(parseD(a).getDate()));tot+=v;
  }
  let h='<div class="card"><div class="row" style="align-items:center"><h2 style="margin:0">Weekly volume</h2><div class="seg"><button data-a="vm" data-v="kg" aria-pressed="'+(mode==='kg')+'">Weight</button><button data-a="vm" data-v="sets" aria-pressed="'+(mode==='sets')+'">Sets</button></div></div>';
  if(!tot)h+='<p class="sub" style="margin-top:8px">Your last 8 weeks will chart here once you log sets.</p></div>';
  else{
    h+='<p class="sub" style="margin:6px 0 4px">'+(mode==='kg'?'Total kg lifted (weight × reps, t = tonnes).':'Hard sets per week.')+' Bars start on the Monday shown.</p>'+barChart(vals,labs,mode)+'</div>';
  }
  /* PRs */
  const pm=exMap(),best={};
  sortedDates().forEach(k=>{
    const dd=S.days[k];if(!dd||!dd.sets)return;
    Object.keys(dd.sets).forEach(id=>{
      let ex=pm[id];
      if(dd.swaps){for(const o in dd.swaps){if(dd.swaps[o].id===id)ex=dd.swaps[o];}}
      if(!ex)return;const m=metaOf(ex);if(m.timed||m.cardio)return;
      dd.sets[id].forEach(x=>{
        if(!x.d||(x.t&&x.t!=='n'&&x.t!=='d'&&x.t!=='m'))return;
        const w=effLoad(ex,x.w),r=+x.r||0;if(!(w>0&&r>0))return;
        const e=e1(w,r),key=String(ex.n).toLowerCase(),b=best[key];
        if(!b||e>b.e+0.01)best[key]={n:ex.n,e:e,w:+x.w||0,r:r,d:k,bw:m.bw,first:b?b.first:k,n0:!b};
      });
    });
  });
  const prs=Object.keys(best).map(k=>best[k]).filter(b=>!b.n0||true).sort((a,b)=>a.d<b.d?1:-1).slice(0,6);
  h+='<div class="card"><h2>Best lifts</h2>';
  if(!prs.length)h+='<p class="sub">Log weights and your best set for each lift shows here, newest first.</p>';
  else h+=prs.map(b=>'<div class="pr"><div><b>'+esc(b.n)+'</b><span class="sub">'+(b.bw?(b.w?'+'+fmt(b.w)+' kg':'bodyweight'):fmt(b.w)+' kg')+' &times; '+b.r+' &middot; '+fmtD(b.d)+'</span></div><span class="e1">~'+Math.round(b.e)+'<small> kg</small></span></div>').join('')+'<p class="sub" style="margin-top:6px">The big number is an estimate of your one-rep max.</p>';
  return h+'</div>';
}

function custKcal(c){
  const p=parseFloat(c.p)||0,cb=parseFloat(c.c)||0,f=parseFloat(c.f)||0;
  const est=Math.round(p*4+cb*4+f*9),hasM=c.p!==''||c.c!==''||c.f!=='',man=c.k!==''&&!isNaN(parseFloat(c.k));
  return {est:est,hasM:hasM,man:man,k:man?parseFloat(c.k):est};
}
function custHint(c){
  const r=custKcal(c);
  if(r.man){
    if(!r.hasM)return 'Using your '+fmt(r.k)+' kcal.';
    const gap=Math.abs(r.k-r.est);
    return 'Using your '+fmt(r.k)+' kcal. The macros add up to '+r.est+' kcal'+(gap>Math.max(20,r.k*0.1)?', a bigger gap than usual, so check the label.':'. Small gaps are normal (fibre, alcohol and rounding on labels).');

}

/* ---------- Weekly check-in ---------- */
function wAvg(from,to){let t=0,n=0;S.meas.entries.forEach(e=>{if(e.date>=from&&e.date<=to&&e.v&&e.v.weight!==undefined&&e.v.weight!==''){t+=+e.v.weight;n++;}});return n?{a:t/n,n:n}:null;}
function checkin(){
  const real=dstr(new Date()),T=S.plan.targets;
  const w0=wAvg(addDays(real,-6),real),w1=wAvg(addDays(real,-13),addDays(real,-7)),w2=wAvg(addDays(real,-20),addDays(real,-14));
  let fd=0,kc=0,pr=0,ph=0,sess=0;
  for(let i=0;i<7;i++){
    const ds=addDays(real,-i),f=dayFood(ds);
    if(f.length){const t=foodTotals(ds);fd++;kc+=t.k;pr+=t.p;if(+T.protein&&t.p>=0.9*T.protein)ph++;}
    if(sessionDone(ds))sess++;
  }
  const planned=S.plan.days.filter(d=>d.wd>=0).length;
  const goal=S.meas.targets.weight!==undefined&&S.meas.targets.weight!==''?+S.meas.targets.weight:null;
  let d1=null,d2=null;
  if(w0&&w1)d1=w0.a-w1.a;
  if(w1&&w2)d2=w1.a-w2.a;
  let tone='',head='',body='';
  const weighedToday=S.meas.entries.some(e=>e.date===real&&e.v&&e.v.weight!==undefined&&e.v.weight!=='');
  if(d1===null){
    head='Need a few more weigh-ins';
    body=w0?'Weigh in on 3 mornings a week. Once there are two weeks of readings, this turns them into a clear call.':'No weigh-ins in the last 7 days. Do one tomorrow morning, before food and water.';
  }else if(goal!==null&&w0.a<=goal+0.2){
    tone='good';head='At your goal weight';body='Hold calories steady and keep lifting. Watch your waist now, it is the number that still has room to move.';
  }else if(d1<-0.8){
    tone='warn';head='Dropping a bit fast';body='Down '+fmt(Math.abs(d1).toFixed(1))+' kg on last week. Fast loss costs muscle. Add about 150 kcal on training days.';
  }else if(d1<=-0.2){
    tone='good';head='On track';body='Down '+fmt(Math.abs(d1).toFixed(1))+' kg on last week, which is the pace you want. No changes, keep going.';
  }else if(d1<0.2){
    if(d2!==null&&Math.abs(d2)<0.2){tone='warn';head='Flat for two weeks';body='Cut about 150 kcal a day (rest days first) and keep protein at '+(T.protein||200)+' g. Recheck in a week.';}
    else{head='Flat this week';body='One flat week is normal, so no change yet. If next week is flat too, cut about 150 kcal a day.';}
  }else{
    tone='warn';head='Up '+fmt(d1.toFixed(1))+' kg on last week';body=d1>0.8?'That is mostly water or a big eating week. Check weekend food and salt, and see how next week lands before changing anything.':'Small rise. Check the weekends first. If it keeps climbing next week, cut about 150 kcal a day.';
  }
  if(d1!==null&&fd<4)body+=fd?' Food was logged on only '+fd+' of 7 days, so treat this as a rough guide.':' No food was logged this week, so I cannot tell if eating explains it.';
  const tile=(n,l,x)=>'<div class="stat"><b>'+n+'</b><span>'+l+'</span>'+(x?'<span class="sub">'+x+'</span>':'')+'</div>';
  let h='<div class="card ckin"><div class="row" style="align-items:baseline"><div><span class="eyebrow">Weekly check-in</span><h2 style="margin-top:2px">'+esc(head)+'</h2></div></div>';
  h+='<p class="ckb '+tone+'">'+esc(body)+'</p>';
  h+='<div class="derived">'
    +tile(w0?fmt(w0.a.toFixed(1)):'-','Weight avg kg',d1!==null?((d1>0?'+':d1<0?'-':'')+fmt(Math.abs(d1).toFixed(1))+' vs last wk'):(w0?w0.n+' reading'+(w0.n>1?'s':''):''))
    +tile(fd?Math.round(kc/fd).toLocaleString('en-GB'):'-','Avg kcal',fd?('target '+(kcalTarget(real)||'-')):'no food logged')
    +tile(fd?Math.round(pr/fd)+' g':'-','Avg protein',fd?(ph+' of '+fd+' days hit it'):'')
    +'</div>';
  h+='<p class="sub" style="margin:8px 0 10px">Sessions '+sess+' of '+planned+' &middot; food logged '+fd+' of 7 days</p>';
  h+='<div class="ciw"><label for="wi">'+(weighedToday?'Weigh-in today (update)':'Weigh in now (kg)')+'<input id="wi" type="number" inputmode="decimal" step="any" data-i="wi" value="'+esc(ui.wi||'')+'" placeholder="'+(latest('weight')!=null?fmt(latest('weight')):'')+'"></label><button class="btn" data-a="wi-save">Save</button></div>';
  return h+'</div>';
}

function setsNamed(dd,id){

  let out=[];Object.keys(dd.sets).forEach(k=>{if(k===id||String(exName(k,dd)).toLowerCase()===nm)out=out.concat(dd.sets[k]);});

function sessMuscles(dd){

    let ex=pm[id];

function gcal(o){
  const tz=(Intl.DateTimeFormat().resolvedOptions().timeZone)||'Europe/London';
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(o.title)+'&details='+encodeURIComponent(o.details)+'&dates='+o.start+'/'+o.end+'&recur='+encodeURIComponent(o.recur)+'&ctz='+encodeURIComponent(tz);
}
function ics(d,hm){return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(hm[0])+pad(hm[1])+'00';}
function endHM(hm,dur){const t=hm[0]*60+hm[1]+dur;return [Math.floor(t/60)%24,t%60];}
function nextWd(wd){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+((wd-d.getDay()+7)%7));return d;}
function firstSunday(){
  const n=new Date();
  for(let k=0;k<3;k++){
    const y=n.getFullYear(),m=n.getMonth()+k;
    const f=new Date(y,m,1);const d=new Date(y,m,1+((7-f.getDay())%7));
    if(d>=new Date(n.getFullYear(),n.getMonth(),n.getDate()))return d;
  }
  return n;
}

async function saveFile(name,data){
  try{
    const type=name.endsWith('.json')?'application/json':'text/csv';
    const blob=new Blob([data],{type:type});
    if((IS_IOS||/Android/i.test(navigator.userAgent))&&navigator.canShare){
      const file=new File([blob],name,{type:type});
      if(navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});toast('Saved');return true;}
    }
    const u=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);
    toast('Saved');return true;
  }catch(e){if(e&&e.name==='AbortError')return false;toast('Could not save the file');return false;}
}
const csvc=v=>{v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
function csvMeas(){
  const rows=[['date'].concat(METRICS.map(m=>m.n+' ('+m.u+')')).concat(['note'])];
  S.meas.entries.forEach(e=>rows.push([e.date].concat(METRICS.map(m=>e.v&&e.v[m.k]!==undefined?e.v[m.k]:'')).concat([e.note||''])));
  return rows.map(r=>r.map(csvc).join(',')).join('\n');
}
function csvSets(){
  const rows=[['date','session','exercise','set','type','kg','reps','rpe']];
  sortedDates().forEach(date=>{
    const d=S.days[date],day=findDay(d.dayId);
    Object.keys(d.sets||{}).forEach(id=>{const ex=findEx(id);(d.sets[id]||[]).forEach((s,i)=>{if(s.d)rows.push([date,day?day.name:'',ex?ex.n:id,i+1,typeName(s.t),s.w,s.r,s.rpe==null?'':s.rpe]);});});
  });
  return rows.map(r=>r.map(csvc).join(',')).join('\n');
}
function doImport(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const j=JSON.parse(r.result);
      if(!j||typeof j!=='object')throw 0;
      if(j.plan){S.plan=normPlan(j.plan);S.plan.ed=true;touch('plan');}
      if(j.meas){S.meas=normMeas(j.meas);touch('meas');}
      if(j.days){Object.keys(j.days).forEach(k=>{const l=S.days[k];if(!l||(l.t||0)<=(j.days[k].t||0)){S.days[k]=clone(j.days[k]);touch('d_'+k);}});}
      render();toast('Backup restored');
    }catch(e){toast('That file is not a backup from this app');}
  };
  r.readAsText(file);
}

function plateCalc(total,bar,plates){
  const per=Math.round(((total-bar)/2)*100)/100;
  if(per<0)return {err:'That is lighter than the bar.',list:[],rem:0,loaded:bar};
  const inv=plates.slice().sort((a,b)=>b-a);let rem=per;const list=[];
  inv.forEach(p=>{while(p>0&&rem+1e-9>=p){list.push(p);rem=Math.round((rem-p)*100)/100;}});
  const sum=list.reduce((a,b)=>a+b,0);
  return {list:list,rem:rem,loaded:Math.round((bar+2*sum)*100)/100,sum:sum};
}
function barbellSVG(list){
  const W=420,H=124,cx=210,y=62,dim=p=>PLATE_DIM[p]||[Math.max(36,Math.min(104,p*4+30)),Math.max(5,Math.min(16,p/1.6+4)),'#8a8f98'];
  let s='<svg class="barbell" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(list.length?'Barbell with '+list.join(', ')+' kilogram plates on each side':'Empty barbell')+'">';
  s+='<rect class="bb" x="8" y="'+(y-5)+'" width="'+(W-16)+'" height="10" rx="3"/>';
  s+='<rect class="bc" x="'+(cx-58)+'" y="'+(y-14)+'" width="8" height="28" rx="2"/><rect class="bc" x="'+(cx+50)+'" y="'+(y-14)+'" width="8" height="28" rx="2"/>';
  let x=cx+62;
  list.forEach(p=>{const d=dim(p),h=d[0],w=d[1];[x,W-x-w].forEach(px=>{s+='<rect class="pl" x="'+px+'" y="'+(y-h/2)+'" width="'+w+'" height="'+h+'" rx="3" fill="'+d[2]+'"/>';});x+=w+2;});
  return s+'</svg>';
}
function pmOut(){
  const st=S.plan.settings,bar=+st.bar||20,total=parseFloat(ui.pm.w);
  if(!total)return barbellSVG([])+'<p class="sub">Enter the total weight you want on the bar.</p>';
  const r=plateCalc(total,bar,st.plates||STD_PLATES);
  if(r.err)return barbellSVG([])+'<p class="sub">'+r.err+'</p>';
  let h=barbellSVG(r.list)+'<div class="pm-res"><b>'+(r.list.length?r.list.map(String).join(' + '):'Just the bar')+'</b>'+(r.list.length?'<small>kg on each side</small>':'')+'</div>';
  if(r.rem>0.001)h+='<p class="sub" style="color:var(--warn)">With your plates the closest you can load is '+fmt(r.loaded)+' kg, '+fmt(Math.round((total-r.loaded)*100)/100)+' kg short.</p>';
  else h+='<p class="sub">'+fmt(bar)+' kg bar + '+fmt(2*r.sum)+' kg of plates = '+fmt(total)+' kg.</p>';
  return h;
}
function paintModal(){
  const m=$('#modal');
  if(ui.pg&&!ui.xb){paintPg();return;}
  if(ui.ph){paintPh();return;}
  if(ui.wg){paintWg();return;}
  if(ui.xb){paintXb();return;}
  if(ui.fd){paintFood();return;}
  if(ui.lib){paintLib();return;}
  if(ui.alt){paintAlt();return;}
  if(!ui.pm){m.hidden=true;m.innerHTML='';return;}
  const st=S.plan.settings,have=st.plates||STD_PLATES;
  m.innerHTML='<div class="mback" data-a="pm-close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Plate calculator"><div class="shh"><h2>Plate calculator</h2><button class="link" data-a="pm-close">Close</button></div>'
   +'<div class="mform"><label for="pm-w">Total weight (kg)<input id="pm-w" type="number" inputmode="decimal" step="any" data-i="pm-w" value="'+esc(ui.pm.w)+'" placeholder="60"></label><label for="pm-b">Bar (kg)<input id="pm-b" type="number" inputmode="decimal" step="any" data-i="pm-b" value="'+esc(st.bar)+'"></label></div>'
   +'<div class="row" style="margin-top:8px"><button class="btn ghost sm" data-a="pm-step" data-dir="-1">-2.5 kg</button><button class="btn ghost sm" data-a="pm-step" data-dir="1">+2.5 kg</button></div>'
   +'<div id="pm-out">'+pmOut()+'</div>'
   +'<div class="eyebrow" style="margin-top:10px">Plates your gym has (tap to switch off)</div><div class="pchips">'+STD_PLATES.map(p=>'<button data-a="pm-plate" data-p="'+p+'" aria-pressed="'+(have.indexOf(p)>=0)+'">'+p+'</button>').join('')+'</div></div>';

/* ---------- swipe to delete ---------- */
let swp=null;
document.addEventListener('pointerdown',e=>{
  const w=e.target.closest&&e.target.closest('.sw');
  if(!w||e.target.closest('button'))return;
  swp={w:w,el:w.querySelector('.set'),x:e.clientX,y:e.clientY,id:e.pointerId,on:false,dx:0};
});
document.addEventListener('pointermove',e=>{
  if(!swp||e.pointerId!==swp.id)return;
  const dx=e.clientX-swp.x,dy=e.clientY-swp.y;
  if(!swp.on){
    if(dx<-12&&Math.abs(dx)>Math.abs(dy)*1.5){swp.on=true;swp.w.classList.add('on');swp.el.style.transition='none';try{swp.el.setPointerCapture(e.pointerId);}catch(x){}}
    else{if(Math.abs(dy)>12||dx>12)swp=null;return;}
  }
  swp.dx=Math.min(0,dx);swp.el.style.transform='translateX('+swp.dx+'px)';
  swp.w.classList.toggle('arm',swp.dx<-90);
});
function endSwipe(e){
  if(!swp||e.pointerId!==swp.id)return;
  const s0=swp;swp=null;if(!s0.on)return;
  s0.el.style.transition='transform .18s ease-out';
  if(s0.dx<-90){s0.el.style.transform='translateX(-110%)';setTimeout(()=>delSet(s0.w.dataset.ex,+s0.w.dataset.n),170);}
  else{s0.el.style.transform='';s0.w.classList.remove('arm');setTimeout(()=>s0.w.classList.remove('on'),190);}
}
document.addEventListener('pointerup',endSwipe);
document.addEventListener('pointercancel',endSwipe);
function delSet(exId,i){
  const ex=findEx(exId);if(!ex)return;
  const dd=sessionDoc(),st=ensureSets(dd,ex);if(!st[i])return;
  const removed=st[i];let replaced=false;
  if(st.length>1)st.splice(i,1);else{st[0]={w:'',r:'',d:false};replaced=true;}
  ui.undo={date:ui.date,ex:exId,i:i,s:removed,rep:replaced};
  touchDay(ui.date);render();
  toast('Set deleted',{a:'undo',label:'Undo'},6000);
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  const a=t.dataset.a;
  if(a==='base-toggle'){ui.base=!t.parentElement.open;return;}
  const D=t.dataset;
  if(a.indexOf('au-')===0&&a!=='au-out-ask'){auAction(a,D);return;}
  if(a==='scan-close'){scanClose();return;}
  if(a.indexOf('pg-')===0&&pgAction(a,D))return;
  if(a==='sw-update'){if(ui.swWait){ui.swAsked=true;ui.swWait.postMessage('skip');}return;}
  if(a==='su-plan'){ui.suPlan=D.v;document.querySelectorAll('.su-plan').forEach(b=>b.setAttribute('aria-checked',String(b.dataset.v===D.v)));return;}
  if(a==='au-out-ask'){doSignOut(false);return;}
  if(a==='install'){if(INSTALL){INSTALL.prompt();INSTALL.userChoice.finally(()=>{INSTALL=null;render();});}return;}
  switch(a){
    case 'tab':go(D.t);break;
    case 'goto':if(D.pv)ui.pv=D.pv;go(D.t);break;
    case 'date':{ui.date=D.n==='0'?dstr(new Date()):addDays(ui.date,+D.n);render();break;}
    case 'tog-set':{
      const ex=findEx(D.ex),dd=sessionDoc(),st=ensureSets(dd,ex),i=+D.n;
      while(st.length<=i)st.push({w:'',r:'',d:false});
      const s=st[i];s.d=!s.d;
      if(s.d){
        const ph=placeholderFor(ex.id,i,ui.date);
        if(s.w===''&&ph.w!=='')s.w=num(ph.w);
        if(s.r===''&&ph.r!=='')s.r=num(ph.r);
        onLogged(ex,st,s);
      }else s.pr=false;
      touchDay(ui.date);render();break;
    }
    case 'use-prev':{
      const ex=findEx(D.ex),dd=sessionDoc(),st=ensureSets(dd,ex),i=+D.n;
      while(st.length<=i)st.push({w:'',r:'',d:false});
      const ph=lastSetVals(ex.id,i,ui.date);
      if(ph.w!=='')st[i].w=num(ph.w);if(ph.r!=='')st[i].r=num(ph.r);
      touchDay(ui.date);render();break;
    }
    case 'nx-w':case 'nx-r':{
      const c=curNext();if(!c)break;
      const v=valFor(c.ex,c.i,ui.date),f=a==='nx-w'?'w':'r',mt=metaOf(c.ex),step=f==='w'?2.5:(mt.timed?5:1);
      const lo=(f==='w'&&mt.bw)?-100:0;
      const base=+v[f]||0,nv=Math.max(lo,Math.round((base+(+D.dir)*step)*100)/100);
      c.st[c.i][f]=nv;touchDay(ui.date);render();break;
    }
    case 'nx-log':{
      const c=curNext();if(!c)break;
      const v=valFor(c.ex,c.i,ui.date);
      if(v.r===''&&v.w===''){toast('Add the weight and reps first');break;}
      const s=c.st[c.i];s.w=v.w===''?'':num(v.w);s.r=v.r===''?'':num(v.r);s.d=true;
      onLogged(c.ex,c.st,s);touchDay(ui.date);render();break;
    }
    case 'set-type':{
      const ex=findEx(D.ex),dd=sessionDoc(),st=ensureSets(dd,ex),i=+D.n;
      while(st.length<=i)st.push({w:'',r:'',d:false});
      const c=st[i].t||'n',cyc=['n','w','d','m','l'];st[i].t=cyc[(cyc.indexOf(c)+1)%cyc.length];
      touchDay(ui.date);render();break;
    }
    case 'undo':{
      const u=ui.undo;if(!u)break;

      const st=ensureSets(dd,ex);
      if(u.rep)st[0]=u.s;else st.splice(u.i,0,u.s);

document.addEventListener('input',e=>{
  const t=e.target,D=t.dataset;if(!D||!D.i)return;
  switch(D.i){
    case 'ph-d':ui.pd=t.value||dstr(new Date());break;
    case 'sw':case 'sr':{
      const ex=findEx(D.ex);if(!ex)return;
      const dd=sessionDoc(),st=ensureSets(dd,ex),i=+D.n;
      while(st.length<=i)st.push({w:'',r:'',d:false});
      st[i][D.i==='sw'?'w':'r']=num(t.value);touchDay(ui.date);paintNext();break;
    }
    case 'srpe':{
      const ex=findEx(D.ex);if(!ex)return;
      const dd=sessionDoc(),st=ensureSets(dd,ex),i=+D.n;
      while(st.length<=i)st.push({w:'',r:'',d:false});
      st[i].rpe=num(t.value);touchDay(ui.date);break;
    }
    case 'alt-q':{if(ui.alt){ui.alt.q=t.value;ui.alt.sel=null;refreshAlt();}break;}
    case 'lib-q':{if(ui.lib){ui.lib.q=t.value;refreshLib();}break;}
    case 'xb-q':{if(ui.xb){ui.xb.q=t.value;ui.xb.n=40;refreshXb('l');}break;}
    case 'fd-q':{
      if(ui.fd){
        const v=t.value;
        if(v.indexOf('CFOOD1|')===0){
          const a=v.split('|'),bc=bcNorm(a[7]),nv=x=>{const y=parseFloat(x);return isFinite(y)&&y>=0?String(y):'';};
          if(a.length>=7){
            const F=ui.fd;F.mode='cust';F.edit=null;F.read=true;F.q='';
            F.cust={n:(a[1]||'').slice(0,60),lbl:(a[2]||'1 serving').slice(0,40),k:nv(a[3]),p:nv(a[4]),c:nv(a[5]),f:nv(a[6]),bc:eanOk(bc)?bc:'',save:true};
            const hit=F.cust.bc&&foodsAll().find(x=>x.bc===F.cust.bc);
            paintFood();toast(hit?'You already have this barcode saved as '+hit.n+'. Saving will replace it.':'From your scanner. Check the numbers against the pack, then save.',null,5000);break;
          }
        }
        ui.fd.q=v;refreshFood('lc');
      }
      break;
    }
    case 'fd-qty':{if(ui.fd&&ui.fd.sf){ui.fd.qt=t.value;const r=$('#fd-read');if(r)r.innerHTML=fdReadHTML(ui.fd.sf);}break;}
    case 'fd-c':{if(ui.fd){ui.fd.cust[D.f]=t.value;const hh=$('#fc-hint');if(hh)hh.textContent=custHint(ui.fd.cust);const kk=$('#fc-k');if(kk){const r=custKcal(ui.fd.cust);kk.placeholder=(!r.man&&r.hasM)?'~'+r.est:'';}}break;}
    case 'fe-x':{const e=dayFood(ui.date).find(x=>x.id===D.id),n=parseFloat(t.value);if(e&&n>0){feApply(e,n);touchDay(ui.date);const rd=$('#fe-read');if(rd)rd.textContent=feRead(e);}break;}
    case 'pnf':{const x=S.plan.pain.find(q=>q.id===D.id);if(x){x[D.f]=t.value;touchPlan();}break;}
    case 'sm-name':{if(ui.sm)ui.sm.name=t.value;break;}
    case 'pm-w':{if(ui.pm){ui.pm.w=t.value;const o=$('#pm-out');if(o)o.innerHTML=pmOut();}break;}
    case 'pm-b':{S.plan.settings.bar=parseFloat(t.value)||0;touchPlan();const o=$('#pm-out');if(o&&ui.pm)o.innerHTML=pmOut();break;}
    case 'nxw':case 'nxr':{const c=curNext();if(!c)return;c.st[c.i][D.i==='nxw'?'w':'r']=num(t.value);touchDay(ui.date);break;}
    case 'note':{const dd=sessionDoc();dd.note=t.value;touchDay(ui.date);break;}
    case 'plate':ui.plateSide=parseFloat(t.value)||0;{const o=$('#pout');if(o)o.textContent=fmt(plateTotal())+' kg total';}break;
    case 'bar':S.plan.settings.bar=parseFloat(t.value)||0;touchPlan();{const o=$('#pout');if(o)o.textContent=fmt(plateTotal())+' kg total';}break;
    case 'wi':ui.wi=t.value;break;
    case 'nq':{ui.nq=t.value;const l=$('#nlist');if(l)l.innerHTML=noteListHTML();break;}
    case 'mdate':ui.form.date=t.value;break;
    case 'mnote':ui.form.note=t.value;break;
    case 'mf':ui.form.v[D.k]=t.value;break;
    case 'base':{const n=num(t.value);if(n==='')delete S.meas.baseline[D.k];else S.meas.baseline[D.k]=n;touch('meas');break;}
    case 'tgt':{const n=num(t.value);if(n==='')delete S.meas.targets[D.k];else S.meas.targets[D.k]=n;touch('meas');break;}
    case 'dname':{const d=findDay(D.d);if(!d)return;d.name=t.value;touchPlan();const el=document.querySelector('[data-hname="'+D.d+'"]');if(el)el.textContent=t.value;break;}
    case 'dnote':{const d=findDay(D.d);if(d){d.note=t.value;touchPlan();}break;}
    case 'exf':{
      const d=findDay(D.d),ex=d&&d.ex.find(x=>x.id===D.ex);if(!ex)return;
      const f=D.f;ex[f]=(f==='s'||f==='rest')?(num(t.value)===''?0:num(t.value)):t.value;touchPlan();break;
    }
    case 'wuf':{const w=S.plan.warmup[+D.n];if(w){w[D.f]=t.value;touchPlan();}break;}
    case 'habf':{const x=S.plan.habits[+D.n];if(x){x.t=t.value;touchPlan();}break;}
    case 'tgf':{const n=num(t.value);S.plan.targets[D.f]=n===''?0:n;touchPlan();break;}
    case 'stf':{const f=D.f;S.plan.settings[f]=(f==='name'||f==='time')?t.value:(num(t.value)===''?0:num(t.value));touchPlan();break;}
  }
});

function applyTheme(){

/* ================= programmes: library, personal fit, own programmes, coaching ================= */
const PGOAL=[['All','Any goal'],['beginner','New to training'],['muscle','Build muscle'],['strength','Get stronger'],['fatloss','Lose fat'],['home','Train at home'],['arms','Focus: arms'],['biceps','Focus: biceps'],['chest','Focus: chest'],['shoulders','Focus: shoulders'],['back','Focus: back'],['legs','Focus: legs'],['glutes','Focus: glutes'],['abs','Focus: abs and core']];
const PFOCUS={arms:'Arms',biceps:'Biceps',chest:'Chest',shoulders:'Shoulders',back:'Back',legs:'Legs',glutes:'Glutes',abs:'Abs and core'};
const PEQ={gym:'Gym',dumbbells:'Dumbbells',none:'No equipment'};
const PLEVELS=['Starter','Intermediate','Advanced'];
function progs(){return (window.CL_PROGRAMS||[]).concat((S.plan.myProgs||[]));}
function progById(id){return progs().find(p=>p.id===id)||null;}
function progWeekOf(pr,date){
  const P=S.plan.prog;if(!P||!pr)return 0;
  return Math.max(1,Math.floor(daysBetween(P.start,weekStart(date||dstr(new Date())))/7)+1);
}
function phaseFor(pr,w){
  if(!pr.phases||!pr.phases.length)return {ph:null,deload:(pr.deload||[]).indexOf(w)>=0};
  const ph=pr.phases.find(x=>w>=x.w[0]&&w<=x.w[1]);
  if(ph)return {ph:ph,deload:false};
  if(pr.deload.indexOf(w)>=0){let prev=null;pr.phases.forEach(x=>{if(x.w[1]<w)prev=x;});return {ph:prev||pr.phases[0],deload:true};}
  return {ph:pr.phases[pr.phases.length-1],deload:false};
}
function scheme(s){return s?s[0]+' × '+s[1]:'';}
function waveWeek(pr,w){return ((Math.min(w,pr.weeks)-1)%4)+1;}
/* sets/reps (and wave percentages) for one programme row in a given week, with personal adjustments */
function exForWeek(row,pr,w,adj){
  const f=phaseFor(pr,Math.min(w,pr.weeks));
  if(row[6]&&window.CL_WAVE){
    const wv=window.CL_WAVE[waveWeek(pr,w)];
    return {s:wv.length,r:wv.map(x=>x[1]).join(', '),pct:wv.map(x=>x[0]),prs:wv.map(x=>x[1])};
  }
  let s=row[1],r=row[2];
  if(f.ph){
    const sc=row[4]?f.ph.main:f.ph.acc,plainRange=/^\d+(-\d+)?$/.test(String(row[2]));
    if(sc&&row[1]>1){s=sc[0];if(plainRange)r=sc[1];}
  }
  if(f.deload&&s>1)s=Math.max(1,Math.round(s/2));
  if(adj&&adj.vol&&s>2&&!f.deload)s=Math.max(2,s+adj.vol);
  return {s:s,r:r};
}
function swapName(n,adj){
  if(!adj||!adj.avoid||!window.CL_SWAPS)return n;
  for(const a of adj.avoid){const m=window.CL_SWAPS[a];if(m&&m[n])return m[n];}
  return n;
}
function progRows(pr,adj){
  const days=pr.plan.map(d=>({name:d.name,ex:d.ex.map(e=>{const nn=swapName(e[0],adj);const r=e.slice();if(nn!==e[0]){r[0]=nn;r[5]='Gentler swap for '+e[0]+'.';}return r;})}));
  if(adj&&adj.focus&&pr.focus!==adj.focus&&window.CL_FOCUS_ADD&&window.CL_FOCUS_ADD[adj.focus]){
    const add=window.CL_FOCUS_ADD[adj.focus];
    [0,Math.min(2,days.length-1)].filter((v,i,a)=>a.indexOf(v)===i).forEach(i=>{add.forEach(e=>{if(!days[i].ex.some(x=>x[0]===e[0]))days[i].ex.push(e.slice());});});
  }
  return days;
}
function progBuildDays(pr,adj){
  return progRows(pr,adj).map((d,i)=>({id:'p'+i+uid8(),name:d.name,wd:pr.sched[i]===undefined?-1:pr.sched[i],note:'',ex:d.ex.map((e,j)=>({id:'pe'+uid8(),n:e[0],s:e[1],r:e[2],rest:e[3],cue:e[5]||'',tag:'',pk:i+'-'+j}))}));
}
function progApply(force){
  const P=S.plan.prog;if(!P)return false;
  const pr=progById(P.id);if(!pr)return false;
  if(pr.custom){progSyncCustom(pr);return false;}
  const w=progWeekOf(pr);
  if(!force&&P.aw===w)return false;
  const rows=progRows(pr,P.adj);
  S.plan.days.forEach(d=>d.ex.forEach(e=>{
    if(!e.pk)return;const ij=e.pk.split('-').map(Number),row=rows[ij[0]]&&rows[ij[0]].ex[ij[1]];
    if(!row||String(row[0]).toLowerCase()!==String(e.n).toLowerCase())return;
    const x=exForWeek(row,pr,w,P.adj);e.s=x.s;e.r=x.r;
    if(x.pct){e.pct=x.pct;e.prs=x.prs;}else{delete e.pct;delete e.prs;}
  }));
  P.aw=w;touchPlan();return true;
}
function progStart(id,adj){
  const pr=progById(id);if(!pr)return;
  const P=S.plan;
  if(!P.prog)P.myDays=clone(P.days);
  P.prog={id:pr.id,start:weekStart(dstr(new Date())),aw:0,adj:adj||null};
  if(pr.custom){P.days=clone(pr.days||[]);}
  else P.days=progBuildDays(pr,adj);
  P.exn=P.exn||{};P.days.forEach(d=>d.ex.forEach(e=>{P.exn[e.id]=e.n;}));
  if(!pr.custom)progApply(true);else touchPlan();
  ui.pg=null;paintModal();ui.tab=pr.custom?'plan':'today';saveNav();render();window.scrollTo(0,0);
  toast(pr.custom?pr.name+' started. Add your days and exercises below.':'Started '+pr.name+'. Week 1 is on Today.',null,4500);
}
function progEnd(){
  const P=S.plan,pr=P.prog&&progById(P.prog.id);
  if(pr&&pr.custom)progSyncCustom(pr);
  P.days=Array.isArray(P.myDays)?P.myDays:[];P.prog=null;
  touchPlan();render();toast((pr?pr.name+' ended. ':'')+'Your own plan is back.',null,3500);
}
/* own programmes keep a copy of their days so they can be restarted later */
function progSyncCustom(pr){
  const days=clone(S.plan.days);
  if(JSON.stringify(days)!==JSON.stringify(pr.days)){pr.days=days;pr.perWeek=days.length;touchPlan();}
}
function progBanner(){

  else if(f.ph)line=esc(f.ph.label)+': main lifts '+scheme(f.ph.main)+', others '+scheme(f.ph.acc)+(f.ph.note?'. '+esc(f.ph.note):'');
  else line='Your own programme.';

function quizDefaults(){const q=S.plan.profile||{};return {goal:q.goal||'muscle',exp:q.exp||'some',days:q.days||'4',mins:q.mins||'60',equip:q.equip||'gym',focus:q.focus||'',avoid:Array.isArray(q.avoid)?q.avoid.slice():[]};}
function minsOf(p){const m=String(p.mins).match(/\d+/g)||[60];return +m[m.length-1];}
function recommend(q){
  const lvl={new:'Starter',some:'Intermediate',years:'Advanced'}[q.exp];
  const days=+q.days,mins=+q.mins;
  const eqOK=p=>q.equip==='gym'||(q.equip==='dumbbells'&&p.equip!=='gym')||(q.equip==='none'&&p.equip==='none');
  return (window.CL_PROGRAMS||[]).filter(eqOK).map(p=>{
    let s=0;const why=[];
    if(q.focus&&p.focus===q.focus){s+=9;why.push('built around '+PFOCUS[q.focus].toLowerCase());}
    else if(q.focus==='biceps'&&p.focus==='arms'){s+=6;why.push('lots of biceps work');}
    if(p.goal===q.goal){s+=6;why.push({muscle:'built for muscle',strength:'built for strength',fatloss:'built for fat loss',home:'made for home training',beginner:'made for new lifters'}[q.goal]);}
    else if(q.goal==='muscle'&&p.goal==='focus'){s+=3;}
    else if(q.goal==='beginner'&&p.level==='Starter'){s+=4;}
    if(q.exp==='new'&&p.goal==='beginner'){s+=7;why.push('made for new lifters');}
    if(p.level===lvl){s+=5;why.push(p.level.toLowerCase()+' level');}
    else if(Math.abs(PLEVELS.indexOf(p.level)-PLEVELS.indexOf(lvl))===1)s+=1;
    else s-=4;
    if(lvl==='Starter'&&p.level==='Advanced')s-=8;
    if(p.perWeek===days){s+=5;why.push(days+' days a week');}
    else if(Math.abs(p.perWeek-days)===1)s+=1;
    else s-=3;
    if(minsOf(p)<=mins+5){s+=2;why.push('fits '+mins+' minutes');}else s-=2;
    if(q.equip!=='gym'&&p.equip===q.equip){s+=3;why.push(PEQ[p.equip].toLowerCase());}
    return {p:p,s:s,why:why};
  }).sort((a,b)=>b.s-a.s);
}
function recommendTop(q){
  const all=recommend(q),top=all.slice(0,3);
  if(q.focus&&!top.some(r=>r.p.focus===q.focus||(q.focus==='biceps'&&r.p.focus==='arms'))){
    const f=all.find(r=>r.p.focus===q.focus&&!(q.exp==='new'&&r.p.level==='Advanced'));
    if(f)top[top.length-1]=f;
  }
  return top;
}
function quizAdj(q){
  const a={vol:q.exp==='new'?-1:0,avoid:q.avoid.slice(),focus:q.focus||''};
  return (a.vol||a.avoid.length||a.focus)?a:null;
}

/* ---------- coaching: percentage waves and stalls ---------- */
function rnd25(x){return Math.max(0,Math.round(x/2.5)*2.5);}
function waveSuggest(ex,date){
  const best=bestBefore(ex,date);
  if(!best)return {ws:ex.pct.map(()=>''),rs:(ex.prs||[]).map(r=>parseInt(r,10)||''),note:'First time on this lift: pick a weight you can do 5 good reps with. After you log it, the app works out your wave weights.'};
  const tm=best*0.9,ws=ex.pct.map(p=>rnd25(tm*p/100)),rs=(ex.prs||[]).map(r=>parseInt(r,10)||'');
  const plus=(ex.prs||[]).some(r=>/\+/.test(String(r)));
  return {ws:ws,rs:rs,note:'Training max '+fmt(rnd25(tm))+' kg (90% of your best estimated 1-rep max). Today: '+ws.map((w,i)=>fmt(w)+' kg × '+ex.prs[i]).join(', ')+'.'+(plus?' Last set: as many good reps as you can.':'')};
}
function stallCheck(ex,date){
  const ds=sortedDates().filter(k=>k<date).reverse(),out=[];
  for(const k of ds){
    const st=setsNamed(S.days[k],ex.id).filter(x=>x.d&&+x.w>0&&isRef(x));
    if(!st.length)continue;
    out.push({w:Math.max.apply(null,st.map(x=>+x.w)),e:Math.max.apply(null,st.map(x=>e1(x.w,x.r)))});
    if(out.length===3)break;
  }
  if(out.length<3)return null;
  const sameW=out.every(x=>x.w===out[0].w),noGain=out[0].e<=out[2].e*1.005;
  if(sameW&&noGain)return {w:out[0].w,drop:rnd25(out[0].w*0.9)};
  return null;
}

function trackWrite(p){
  PENDING++;
  p.then(()=>{PENDING--;if(!PENDING&&navigator.onLine)setSync('synced');})
   .catch(e=>{PENDING--;setSync('error');if(e&&e.code==='permission-denied')toast('Your account could not save that. Sign out and back in.',null,6000);});
}
async function initSync(){
  if(!UID)return;
  const F=FX(),col=F.collection(FS,'users',UID,'docs');
  DB={doc:id=>{
    const r=F.doc(col,id);
    return {
      set:d=>{trackWrite(F.setDoc(r,JSON.parse(JSON.stringify(d))));setSync(navigator.onLine?'saving':'error');return Promise.resolve();},
      delete:()=>{trackWrite(F.deleteDoc(r));return Promise.resolve();}
    };
  }};
  setSync(navigator.onLine?'saving':'error');
  UNSUB=F.onSnapshot(col,{includeMetadataChanges:true},snap=>{
    if(!READY){
      if(snap.metadata.fromCache&&snap.empty&&!LOCALHAD)return;
      READY=true;
      SERVERPLAN=snap.docs.some(x=>x.id==='plan');
    }
    onSnap(snap);
    if(!snap.metadata.hasPendingWrites&&!snap.metadata.fromCache&&!PENDING)setSync('synced');
    else if(snap.metadata.fromCache&&!navigator.onLine)setSync('error');
    if(ui.boot){
      ui.boot=false;
      if(!S.plan.onb&&!SERVERPLAN){ui.setup=true;}
      render();
    }
  },err=>{setSync('error');if(err&&err.code==='permission-denied')showAuth('in','Your session has expired. Sign in again.');});
}

async function wipeLocal(){
  try{if(UNSUB)UNSUB();}catch(e){}

}
async function doSignOut(force){

    if(!twoTap('signout')){toast('Some changes have not reached your account yet. Signing out now loses them. Tap Sign out again to continue.',null,6000);return;}
  }

async function deleteAccount(pw){
  const F=window.FB,FF=FX();
  if(!navigator.onLine){toast('You need an internet connection to delete your account.',null,4500);return;}
  try{
    await F.reauthenticateWithCredential(USER,F.EmailAuthProvider.credential(USER.email,pw));
  }catch(e){toast(auMsg(e),null,5000);return;}
  toast('Deleting your data...',null,30000);
  try{
    for(const c of ['docs','thumbs','photos']){
      const snap=await FF.getDocs(FF.collection(FS,'users',UID,c));
      let b=FF.writeBatch(FS),n=0;
      for(const d of snap.docs){b.delete(d.ref);if(++n===400){await b.commit();b=FF.writeBatch(FS);n=0;}}
      if(n)await b.commit();
    }
    await F.deleteUser(USER);
  }catch(e){toast('Could not finish deleting. Nothing has been lost; try again.',null,6000);return;}
  await wipeLocal();
  location.reload();
}
async function changePassword(cur,nw){

}
