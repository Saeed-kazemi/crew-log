/* ---------- barcode scanner (camera) ---------- */
const BCF=['ean_13','ean_8','upc_a','upc_e'];
let DET=null,SCN=null;
async function getDetector(){
  if(DET)return DET;
  try{
    if('BarcodeDetector' in window){
      const f=await window.BarcodeDetector.getSupportedFormats();
      if(f&&f.indexOf('ean_13')>=0){DET=new window.BarcodeDetector({formats:BCF});return DET;}
    }
  }catch(e){}
  DET=new window.ZXingDetector({formats:BCF});
  return DET;
}
function scanClose(){
  if(!SCN)return;
  clearTimeout(SCN.t);SCN.dead=true;
  if(SCN.stream)SCN.stream.getTracks().forEach(t=>t.stop());
  SCN.el.remove();SCN=null;
}
async function scanOpen(onCode,title){
  scanClose();
  const el=document.createElement('div');
  el.className='scan';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label','Scan a barcode');
  el.innerHTML='<div class="scan-top"><b>'+esc(title||'Scan a barcode')+'</b><button class="scan-x" data-a="scan-close" aria-label="Close scanner">Close</button></div>'
    +'<div class="scan-v"><video playsinline muted autoplay></video><div class="scan-box"><i></i></div><p class="scan-s" id="scan-s">Starting the camera...</p></div>'
    +'<form class="scan-m" id="scan-m"><label for="scan-n">No camera? Type the number under the barcode<span class="scan-row"><input id="scan-n" inputmode="numeric" autocomplete="off" placeholder="e.g. 5000112637922"><button class="btn" type="submit">Use</button></span></label></form>';
  document.body.appendChild(el);
  SCN={el:el,dead:false,stream:null,t:null,cb:onCode};
  const S0=SCN,status=t=>{const s=el.querySelector('#scan-s');if(s)s.textContent=t;};
  el.querySelector('#scan-m').addEventListener('submit',ev=>{ev.preventDefault();const c=bcNorm(el.querySelector('#scan-n').value);if(!eanOk(c)){status('That number does not look right. Check the digits.');return;}const cb=S0.cb;scanClose();cb(c);});
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){status('This browser cannot open the camera. Type the number instead.');return;}
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});}
  catch(e){
    if(S0.dead)return;
    status(e&&e.name==='NotAllowedError'?'Camera access is off for this app. On iPhone: Settings, then Safari (or the app), then Camera, then Allow. On Android: tap the lock icon by the address, then Permissions. Or type the number below.':'Could not start the camera. Type the number below.');
    return;
  }
  if(S0.dead){stream.getTracks().forEach(t=>t.stop());return;}
  S0.stream=stream;
  const v=el.querySelector('video');v.setAttribute('playsinline','');v.muted=true;v.srcObject=stream;
  try{await v.play();}catch(e){}
  status('Hold the barcode inside the box, about 15 cm away.');
  let det;try{det=await getDetector();}catch(e){status('The barcode reader could not load. Type the number below.');return;}
  const tick=async()=>{
    if(S0.dead)return;
    if(v.readyState>=2){
      try{
        const r=await det.detect(v);
        for(const x of r){const c=bcNorm(x.rawValue);if(eanOk(c)){if(navigator.vibrate)navigator.vibrate(40);const cb=S0.cb;scanClose();cb(c);return;}}
      }catch(e){}
    }
    if(!S0.dead)S0.t=setTimeout(tick,160);
  };
  tick();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&SCN)scanClose();});

/* ---------- Open Food Facts ---------- */
async function offLookup(code){
  const url='https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json?fields=product_name,brands,serving_size,serving_quantity,nutriments';
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),12000);
  try{
    const r=await fetch(url,{signal:ctl.signal,headers:{Accept:'application/json'}});
    if(r.status===404)return null;
    if(!r.ok)throw new Error('http '+r.status);
    const j=await r.json();
    if(!j||j.status===0||!j.product)return null;
    const p=j.product,nu=p.nutriments||{},n=v=>{const x=parseFloat(v);return isFinite(x)?x:null;};
    const br=p.brands?String(p.brands).split(',')[0].trim():'',nm=String(p.product_name||'').trim();
    const name=((br&&nm&&nm.toLowerCase().indexOf(br.toLowerCase())<0)?br+' ':'')+nm;
    let ser={k:n(nu['energy-kcal_serving']),p:n(nu.proteins_serving),c:n(nu.carbohydrates_serving),f:n(nu.fat_serving)};
    const h={k:n(nu['energy-kcal_100g']),p:n(nu.proteins_100g),c:n(nu.carbohydrates_100g),f:n(nu.fat_100g)};
    const sq=n(p.serving_quantity);
    let lbl;
    if(ser.k!==null){lbl=p.serving_size||'1 serving';}
    else if(sq&&h.k!==null){const q=sq/100;ser={k:h.k*q,p:h.p===null?null:h.p*q,c:h.c===null?null:h.c*q,f:h.f===null?null:h.f*q};lbl=p.serving_size||(sq+' g');}
    else{ser=h;lbl='100 g';}
    const f1=v=>v===null?'':String(Math.round(v*10)/10);
    return {name:name.slice(0,60),lbl:String(lbl).slice(0,40),k:ser.k===null?'':String(Math.round(ser.k)),p:f1(ser.p),c:f1(ser.c),f:f1(ser.f),hasN:ser.k!==null||ser.p!==null};
  }finally{clearTimeout(to);}
}
async function lookupInto(code){
  if(!ui.fd)return;
  if(!navigator.onLine){toast('Offline. Type the numbers from the pack. Next time you scan it, it will be found straight away.',null,5500);return;}
  toast('Looking up '+code+'...',null,15000);
  try{
    const r=await offLookup(code);
    const F=ui.fd;if(!F||F.mode!=='cust'||F.cust.bc!==code)return;
    if(!r){toast('Not found online. Type the numbers from the pack. It will be saved for next time.',null,5500);return;}
    const c=F.cust;if(!c.n.trim())c.n=r.name;c.lbl=r.lbl;c.k=r.k;c.p=r.p;c.c=r.c;c.f=r.f;F.read=true;paintFood();
    toast(r.hasN?'Found. Check the numbers against the pack, then save.':'Found, but with no nutrition numbers. Type them from the pack.',null,5000);
  }catch(e){toast('Could not reach the food database. Type the numbers from the pack.',null,5000);}
}
function bcFound(code){
  const F=ui.fd;if(!F)return;
  const hit=foodsAll().find(x=>x.bc&&x.bc===code);
  if(hit){F.mode='list';F.cat='U';F.q='';F.sel=fkey(hit.n);F.sf=hit;F.svi=0;F.qt=1;paintFood();toast('Found '+hit.n,null,2500);return;}
  F.mode='cust';F.edit=null;F.read=false;F.cust=custBlank();F.cust.bc=code;paintFood();
  lookupInto(code);
}

/* ---------- progress photos stored in Firestore ---------- */
let PHOTOS=null,PHUNSUB=null;const PHFULL={};
function photosListen(){
  if(PHUNSUB||!UID)return;
  const F=FX();
  PHUNSUB=F.onSnapshot(F.collection(FS,'users',UID,'thumbs'),s=>{PHOTOS=s.docs.map(d=>Object.assign({id:d.id},d.data()));if(ui.tab==='progress'&&ui.pv==='ph')render();},()=>{PHOTOS=PHOTOS||[];});
}
function blobToData(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b);});}
async function addPhoto(file,pose,date){
  const F=FX();
  let full=await blobToData(await shrink(file,1080,.72));
  if(full.length>950000)full=await blobToData(await shrink(file,900,.6));
  const th=await blobToData(await shrink(file,360,.68));
  const id='p'+Date.now().toString(36)+uid8(),t=Date.now();
  trackWrite(F.setDoc(F.doc(FS,'users',UID,'photos',id),{img:full,t:t}));
  trackWrite(F.setDoc(F.doc(FS,'users',UID,'thumbs',id),{date:date,pose:pose,th:th,t:t}));
  PHFULL[id]=full;
}
async function photoFull(id){
  if(PHFULL[id])return PHFULL[id];
  try{const F=FX(),d=await F.getDoc(F.doc(FS,'users',UID,'photos',id));if(d.exists()){PHFULL[id]=d.data().img;return PHFULL[id];}}catch(e){}
  return null;
}
function deletePhoto(id){
  const F=FX();
  trackWrite(F.deleteDoc(F.doc(FS,'users',UID,'thumbs',id)));
  trackWrite(F.deleteDoc(F.doc(FS,'users',UID,'photos',id)));
  delete PHFULL[id];if(PHOTOS)PHOTOS=PHOTOS.filter(x=>x.id!==id);
}

/* ---------- service worker and updates ---------- */
if('serviceWorker' in navigator&&window.isSecureContext){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    const ask=w=>{toast('A new version is ready.',{a:'sw-update',label:'Update'},60000);ui.swWait=w;};
    if(reg.waiting&&navigator.serviceWorker.controller)ask(reg.waiting);
    reg.addEventListener('updatefound',()=>{const w=reg.installing;if(!w)return;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)ask(w);});});
    setInterval(()=>reg.update().catch(()=>{}),60*60*1000);
  }).catch(()=>{});
  let reloading=false;
  // Only reload when the person tapped Update. The first install also fires this event, and a reload then would wipe what they are typing.
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloading||!ui.swAsked)return;reloading=true;location.reload();});
}
